[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egypt-plate-ocr"
version = "0.1.0"
description = "Local inference helpers for an Egyptian plate character detection notebook"
requires-python = ">=3.11"
dependencies = ["typer==0.15.2", "click==8.1.8", "python-dotenv==1.1.0"]

[project.optional-dependencies]
inference = ["ultralytics==8.3.0", "torch==2.4.1", "torchvision==0.19.1"]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.11.2", "mypy==1.15.0", "pre-commit==4.2.0"]

[project.scripts]
egypt-plate-ocr = "egypt_plate_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
