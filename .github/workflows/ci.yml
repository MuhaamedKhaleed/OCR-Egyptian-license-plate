name: CI
on:
  push:
    branches: [main, ocr-local-pilot]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install development package
        run: python -m pip install -e '.[dev]'
      - name: Offline tests
        run: python -m pytest --cov=egypt_plate_ocr --cov-report=term-missing
      - name: Lint
        run: python -m ruff check src tests
      - name: Format
        run: python -m ruff format --check src tests
      - name: Types
        run: python -m mypy src
      - name: Pre-commit
        run: python -m pre_commit run --all-files
      - name: CLI
        run: python -m egypt_plate_ocr --help
      - name: Build container
        run: docker build --tag egypt-plate-ocr:ci .
      - name: Container smoke checks
        run: |
          docker run --rm egypt-plate-ocr:ci --help
          test "$(docker run --rm --entrypoint id egypt-plate-ocr:ci -u)" = 10001
          set +e
          docker run --rm egypt-plate-ocr:ci --image /missing.png --weights /missing.pt
          status=$?
          set -e
          test "$status" = 2
